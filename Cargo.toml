[package]
name = "fakeflixel"
version = "0.1.0"
edition = "2021"
description = "A Flixel-inspired 2D game framework"

[features]
default = []
bevy-ui = ["dep:bevy", "dep:image"]
minifb = ["dep:minifb"]

[dependencies]
bevy = { version = "0.14", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
minifb = { version = "0.27", optional = true }
